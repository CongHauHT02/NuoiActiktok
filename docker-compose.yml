version: "3.8"

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: tiktok_manager_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: tiktok_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Queues & Caching
  redis:
    image: redis:7-alpine
    container_name: tiktok_manager_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiktok_manager_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword2026@postgres:5432/tiktok_manager?schema=public"
      JWT_SECRET: "tiktok-account-manager-super-secret-key-2026"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
      NODE_ENV: "production"
      PORT: 3000
    ports:
      - "3000:3000"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tiktok_manager_nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  redisdata:

